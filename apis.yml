name: OZON.ru
description: >-
  OZON is one of Russia's largest e-commerce marketplaces, offering retail across
  electronics, apparel, groceries, and more, plus its own logistics and
  fulfillment network (FBO/FBS). For developers, OZON exposes the OZON Seller
  API, a POST-based RPC-over-HTTP JSON API at https://api-seller.ozon.ru that
  lets marketplace sellers manage products, prices, stock, warehouses, orders,
  returns, analytics, and finances programmatically. Authentication uses two
  headers, a numeric Client-Id and a secret Api-Key issued in the seller
  cabinet. OZON was surfaced as a portfolio company of Index Ventures and
  enriched by the API Evangelist pipeline from live probes of its API host and
  public developer documentation.
